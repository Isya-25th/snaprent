<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapRent - Sewa Kamera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">Snap<b>Rent</b></a>
    <nav>
      <a href="#">Tentang Kami</a>
      <a href="#">Pusat Bantuan</a>
      <button class="ikon" id="btn-keranjang" aria-label="Keranjang">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        <span class="badge" id="jumlah" hidden>0</span>
      </button>
      <a class="ikon" href="#" aria-label="Akun">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>
      </a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Temukan Kamera Impianmu</h1>
  <p class="sub">Pilih tanggal sewa untuk melihat unit yang tersedia.</p>

  <section class="filter" aria-label="Filter katalog">
    <label>Tanggal &amp; Jam Mulai<input type="datetime-local" id="mulai"></label>
    <label>Tanggal &amp; Jam Selesai<input type="datetime-local" id="selesai"></label>
    <label>Kategori<select id="kategori"><option value="">Semua Kategori</option></select></label>
    <label>Cari<input type="search" id="cari" placeholder="Cari nama barang"></label>
  </section>
  <p class="pesan" id="pesan" role="alert"></p>
  <p class="sub hasil" id="hasil" aria-live="polite"></p>
  <ul class="grid" id="grid"></ul>
</main>

<dialog id="dlg"><div class="isi" id="isi"></div></dialog>
<footer><div class="wrap">&copy; 2026 SnapRent. Sistem penyewaan kamera berbasis web.</div></footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/katalog.js"></script>
</body>
</html>
